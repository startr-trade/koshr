name: release

# A tag vX.Y.Z publishes the crate and the binaries. A manual run (workflow_dispatch) does everything
# up to publishing and, unless `publish` is set (default false), publishes nothing: run it once before the cut.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish to crates.io and create the GitHub release"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing is built or published from a commit whose `ci` run has not succeeded.
  ci-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: CI succeeded on this commit
        shell: bash
        run: |
          sha="${{ github.sha }}"
          while true; do
            run="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${sha}" \
              --jq '.workflow_runs | sort_by(.created_at) | last // empty | [.status, (.conclusion // "")] | @tsv')"
            status="${run%%$'\t'*}"
            conclusion="${run#*$'\t'}"
            echo "newest ci run on ${sha}: status=${status:-none} conclusion=${conclusion:-none}"
            case "$status" in
              queued|in_progress|waiting|pending) sleep 30 ;;
              *) break ;;
            esac
          done
          if [ -z "$run" ] || [ "$conclusion" != "success" ]; then
            echo "CI has not succeeded on ${sha}"
            exit 1
          fi

  # The dependency-tier proof, rerun on the release commit.
  no-c:
    needs: ci-green
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: rustup show
        run: rustup show
      - name: make no-c
        run: make no-c

  build:
    needs: ci-green
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: rustup show
        shell: bash
        run: rustup show
      # Reads main's cache only: a release run never writes one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}
          save-if: false
      - name: add target
        shell: bash
        run: rustup target add "$TARGET"
      # The musl targets are pure Rust here; aarch64 only needs a cross linker.
      - name: musl tools
        if: contains(matrix.target, 'linux-musl')
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "koshr") | .version')"
          test -n "$version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match the crate version ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: build
        shell: bash
        run: cargo build --release --locked -p koshr --target "$TARGET"
      - name: package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="koshr-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/koshr" README.md LICENSE-MIT LICENSE-APACHE "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          rm -rf "dist/${name}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"; fi
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "koshr-$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/$env:TARGET/release/koshr.exe", README.md, LICENSE-MIT, LICENSE-APACHE -Destination "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist/$name.zip").Hash.ToLower()
          Set-Content -NoNewline -Path "dist/$name.zip.sha256" -Value "$hash  $name.zip`n"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koshr-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The CycloneDX SBOM is attached to every release.
  sbom:
    needs: ci-green
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: rustup show
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-sbom
          save-if: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-cyclonedx@0.5.7
      # kanbanr writes the notes to docs/guide/releases/v<version>.md; check here, because this job
      # runs on manual runs too and the release step that reads them does not.
      - name: release notes exist
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "koshr") | .version')"
          test -f "docs/guide/releases/v${version}.md" || { echo "::error::docs/guide/releases/v${version}.md is missing"; exit 1; }
      - name: cargo cyclonedx
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "koshr") | .version')"
          cargo cyclonedx --manifest-path crates/koshr/Cargo.toml --format json --all-features --override-filename sbom
          mkdir -p dist
          cp crates/koshr/sbom.json "dist/koshr-${version}.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koshr-sbom
          path: dist/*.cdx.json
          if-no-files-found: error

  # A fixable high or critical vulnerability in an archive or the SBOM stops the release. It runs in
  # a manual run too, so the manual run before the cut is this job's result.
  scan:
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: trivy fs over the archives
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: artifacts
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: find the CycloneDX file
        id: sbom
        shell: bash
        run: echo "file=$(find artifacts -maxdepth 1 -name '*.cdx.json')" >> "$GITHUB_OUTPUT"
      - name: trivy sbom over the CycloneDX file
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: ${{ steps.sbom.outputs.file }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Build provenance for every archive. The only job that mints tokens.
  provenance:
    needs: [build, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip

  # The crate is published from the tag's commit, after a dry run. Only on a tag push or `publish`.
  publish-crates:
    needs: [no-c, scan, provenance]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: rustup show
        run: rustup show
      - name: cargo publish --dry-run
        run: cargo publish -p koshr --locked --dry-run
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p koshr --locked

  # The notes kanbanr drafted, never a commit list. Only on a tag push or `publish`.
  github-release:
    needs: [publish-crates]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: the assets match the target matrix
        run: |
          cd artifacts
          sha256sum -c -- *.sha256
          test "$(find . -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq 5 || { echo "expected five archives"; exit 1; }
          test "$(find . -maxdepth 1 -name '*.cdx.json' | wc -l)" -eq 1 || { echo "expected one SBOM"; exit 1; }
      - name: gh release create
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --notes-file "docs/guide/releases/${GITHUB_REF_NAME}.md" \
            artifacts/*
